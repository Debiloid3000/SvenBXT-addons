name: Windows x86 Movement DLL
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official MetaHook SDK
        run: git clone --depth 1 https://github.com/MetaHookSv/MetaHook.git metahook-sdk
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DMETAHOOK_SDK_DIR="$env:GITHUB_WORKSPACE/metahook-sdk"
      - name: Compile DLL
        run: cmake --build build --config Release --parallel 2
      - name: Check DLL
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/SvenBXTMovement.dll")) { throw "DLL missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: SvenBXTMovement-Windows-x86
          path: build/Release/SvenBXTMovement.dll
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" build/Release/SvenBXTMovement.dll --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes
  math-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test movement formulas
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic -Isrc tests/movement_math_tests.cpp -o math_tests
          ./math_tests
